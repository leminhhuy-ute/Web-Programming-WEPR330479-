name: Verify project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test and package
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Check all JavaScript files
        run: find src/main/resources/static -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Save test reports and application
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-build-and-tests
          path: |
            target/surefire-reports/
            target/topic-management-1.0.0.jar
          retention-days: 7
  mysql-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: student_topic_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare an existing V5 database for upgrade
        env:
          MYSQL_PWD: ci-root-only
        run: |
          mysql -h 127.0.0.1 -u root < database/schema.sql
          mysql -h 127.0.0.1 -u root student_topic_management -e 'DROP TABLE email_notifications;'
      - name: Verify Flyway upgrade and Hibernate schema on MySQL
        env:
          MYSQL_MIGRATION_TEST: 'true'
          DB_URL: jdbc:mysql://127.0.0.1:3306/student_topic_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
          DB_USERNAME: root
          DB_PASSWORD: ci-root-only
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=MySqlMigrationSmokeTest test
      - name: Save MySQL verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-migration-test
          path: target/surefire-reports/
          retention-days: 7
