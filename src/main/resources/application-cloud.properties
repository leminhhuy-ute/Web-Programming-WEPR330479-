# A NEW, EMPTY MySQL database, e.g. Aiven defaultdb. Never uses H2.
# Also accepts the SPRING_DATASOURCE_* variables used in the deployment lab.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=600000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# V1 creates the original schema; existing V6/V7 migrations finish the upgrade.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/cloud,classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=false

# Render terminates HTTPS in front of the container.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
