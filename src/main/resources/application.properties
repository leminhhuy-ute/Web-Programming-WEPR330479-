spring.application.name=hcmute-topic-management
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
spring.profiles.default=demo
spring.datasource.url=jdbc:h2:file:./data/integrated-project;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
# Forwarded headers strategy (none/framework/native).
# Default 'none' to avoid IP spoofing when exposed directly to untrusted networks.
# Set to 'framework' when behind a controlled reverse proxy (Nginx / Render) that overwrites X-Forwarded-For.
server.forward-headers-strategy=${FORWARDED_HEADERS_STRATEGY:none}
# SMTP is opt-in; publication persists the outbox even while delivery is disabled.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@example.invalid}
spring.mail.host=${MAIL_HOST:${SMTP_HOST:localhost}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:${SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.flyway.enabled=false
