<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thông báo - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="announcements" data-view="list">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Thông báo</h1>
                <p class="page-subtitle">Soạn thảo và công bố thông tin dành cho người học, giảng viên.</p>
            </div>
            <a class="button primary" href="form.html">+ Thêm thông báo</a>
        </div>
        <form id="search" class="toolbar">
            <select name="audience">
                <option value="">Tất cả đối tượng</option>
                <option value="ALL">Tất cả</option>
                <option value="LECTURER">Giảng viên</option>
                <option value="STUDENT">Sinh viên</option>
            </select>
            <input id="keyword" name="keyword" placeholder="Tìm kiếm thông báo..." autocomplete="off">
            <button class="button secondary" type="submit">Tìm</button>
        </form>
        <p id="message" class="alert error" hidden role="alert"></p>
        <div class="card table-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="min-width: 200px; width: 240px;">Tiêu đề</th>
                        <th style="width: 140px;">Đối tượng</th>
                        <th style="min-width: 260px;">Nội dung</th>
                        <th style="width: 160px;">Ngày tạo</th>
                        <th style="width: 180px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
