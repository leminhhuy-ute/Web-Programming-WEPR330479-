<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thiết lập đợt đăng ký - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="registration-periods" data-view="form">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Thiết lập đợt đăng ký</h1>
                <p class="page-subtitle">Cấu hình khung thời gian đăng ký đề tài cho giảng viên và sinh viên.</p>
            </div>
            <a class="button secondary" href="list.html">← Quay lại danh sách</a>
        </div>
        <p id="message" class="form-error" role="alert"></p>
        <form id="entity-form" class="card edit-form entity-form">
            <div class="form-section">
                <span class="section-title">1. Thông tin chung</span>
                <div class="form-grid">
                    <label class="full-width">
                        Tên đợt đăng ký
                        <input name="name" placeholder="Ví dụ: Đợt đăng ký Đề tài Học kỳ 1 2026-2027" required>
                    </label>
                    <label class="full-width">
                        Loại đợt đăng ký
                        <select name="type">
                            <option value="COURSE">Môn học</option>
                            <option value="NCKH">Nghiên cứu khoa học</option>
                            <option value="TLCN">Tiểu luận chuyên ngành</option>
                            <option value="KLTN">Khóa luận tốt nghiệp</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">2. Thời gian Giảng viên (Đề xuất đề tài)</span>
                <div class="form-grid">
                    <label>
                        Thời gian bắt đầu
                        <input name="lecturerStartAt" type="datetime-local" required>
                    </label>
                    <label>
                        Thời gian kết thúc
                        <input name="lecturerEndAt" type="datetime-local" required>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">3. Thời gian Sinh viên (Đăng ký đề tài)</span>
                <div class="form-grid">
                    <label>
                        Thời gian bắt đầu
                        <input name="studentStartAt" type="datetime-local" required>
                    </label>
                    <label>
                        Thời gian kết thúc
                        <input name="studentEndAt" type="datetime-local" required>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">4. Các mốc đánh giá & bảo vệ (TLCN / KLTN)</span>
                <div class="form-grid">
                    <label>
                        Hạn nộp nhận xét GVPB (tùy chọn)
                        <input name="reviewDeadline" type="datetime-local">
                    </label>
                    <label>
                        Ngày tổ chức bảo vệ (tùy chọn)
                        <input name="defenseDate" type="date">
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary">Lưu đợt đăng ký</button>
                <a class="button secondary" href="list.html">Hủy</a>
            </div>
        </form>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
