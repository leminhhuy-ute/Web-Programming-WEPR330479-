<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đợt đăng ký - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="registration-periods" data-view="list">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Đợt đăng ký</h1>
                <p class="page-subtitle">Theo dõi các mốc đăng ký của giảng viên và sinh viên.</p>
            </div>
            <a class="button primary" href="form.html">+ Thêm đợt đăng ký</a>
        </div>
        <form id="search" class="toolbar">
            <select name="type">
                <option value="">Tất cả loại</option>
                <option value="COURSE">Môn học</option>
                <option value="NCKH">Nghiên cứu khoa học</option>
                <option value="TLCN">Tiểu luận chuyên ngành</option>
                <option value="KLTN">Khóa luận tốt nghiệp</option>
            </select>
            <input id="keyword" name="keyword" placeholder="Tìm kiếm đợt đăng ký..." autocomplete="off">
            <button class="button secondary" type="submit">Tìm</button>
        </form>
        <p id="message" class="alert error" hidden role="alert"></p>
        <div class="card table-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="min-width: 220px;">Tên đợt đăng ký</th>
                        <th style="width: 170px;">Loại</th>
                        <th style="width: 180px;">Thời gian GV bắt đầu</th>
                        <th style="width: 180px;">Thời gian SV bắt đầu</th>
                        <th style="width: 230px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
