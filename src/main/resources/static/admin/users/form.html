<!doctype html>
<html lang="vi">

<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin tài khoản - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="users" data-view="form">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Thông tin tài khoản</h1>
                <p class="page-subtitle">Tạo mới hoặc cập nhật hồ sơ người dùng trong hệ thống.</p>
            </div>
            <a class="button secondary" href="list.html">← Quay lại danh sách</a>
        </div>
        <p id="message" class="form-error" role="alert"></p>
        <form id="entity-form" class="card edit-form entity-form">
            <div class="form-section">
                <span class="section-title">1. Thông tin cá nhân & Đăng nhập</span>
                <div class="form-grid">
                    <label>
                        Mã tài khoản / MSSV / MSG
                        <input name="userCode" placeholder="Ví dụ: 20110001" required>
                    </label>
                    <label>
                        Username
                        <input name="username" placeholder="Tên đăng nhập" required>
                    </label>
                    <label>
                        Họ và tên
                        <input name="fullName" placeholder="Nguyễn Văn Minh" required>
                    </label>
                    <label>
                        Email
                        <input name="email" type="email" placeholder="nguyenvanminh@hcmute.edu.vn" required>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <span class="section-title">2. Phân quyền & Đơn vị trực thuộc</span>
                <div class="form-grid">
                    <label>
                        Vai trò
                        <select name="role">
                            <option value="STUDENT">Sinh viên</option>
                            <option value="LECTURER">Giảng viên</option>
                            <option value="DEAN">Trưởng khoa</option>
                        </select>
                    </label>
                    <label id="student-class-field" hidden>
                        Lớp sinh viên
                        <input name="studentClass" maxlength="50" placeholder="Ví dụ: 24110CTNB">
                        <small>Chỉ quản trị viên cập nhật; sinh viên xem trong hồ sơ cá nhân.</small>
                    </label>
                    <label>
                        Bộ môn
                        <select name="departmentId">
                            <option value="">-- Không chọn --</option>
                        </select>
                    </label>
                    <label>
                        Trạng thái hoạt động
                        <select name="status">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Không hoạt động</option>
                            <option value="LOCKED">Đã khóa</option>
                        </select>
                    </label>
                    <label>
                        Mật khẩu
                        <input name="password" type="password" minlength="8" maxlength="72"
                               pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,72}"
                               title="8–72 ký tự, có chữ hoa, chữ thường, số, ký tự đặc biệt và không có khoảng trắng"
                               placeholder="Nhập mật khẩu mới">
                        <small>8–72 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt; để trống nếu không đổi.</small>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary">Lưu thông tin</button>
                <a class="button secondary" href="list.html">Hủy</a>
            </div>
        </form>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/password-toggle.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
