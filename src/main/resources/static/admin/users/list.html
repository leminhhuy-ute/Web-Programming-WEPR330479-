<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="users" data-view="list">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Tài khoản</h1>
                <p class="page-subtitle">Quản lý thông tin, vai trò và trạng thái tài khoản.</p>
            </div>
            <a class="button primary" href="form.html">+ Thêm tài khoản</a>
        </div>
        <form id="search" class="toolbar users-toolbar">
            <select name="role">
                <option value="">Tất cả vai trò</option>
                <option value="DEAN">Trưởng khoa</option>
                <option value="HEAD_OF_DEPT">Trưởng bộ môn</option><option value="LECTURER">Giảng viên</option>
                <option value="STUDENT">Sinh viên</option>
            </select>
            <select name="departmentId">
                <option value="">Tất cả bộ môn</option>
            </select>
            <input id="keyword" name="keyword" placeholder="Tìm kiếm tài khoản..." autocomplete="off">
            <button class="button secondary" type="submit">Tìm</button>
        </form>
        <p id="message" class="alert error" hidden role="alert"></p>
        <div class="card table-scroll">
            <table class="users-table">
                <colgroup>
                    <col class="col-code">
                    <col class="col-username">
                    <col class="col-name">
                    <col class="col-email">
                    <col class="col-role">
                    <col class="col-department">
                    <col class="col-status">
                    <col class="col-actions">
                </colgroup>
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Username</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Bộ môn</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
