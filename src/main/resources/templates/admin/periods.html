<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đợt Đăng ký Đề tài')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: sidebar('admin-periods')}"></aside>
    <main class="md:col-span-3 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">Quản lý Đợt Đăng ký & Cột mốc</h1>
                    <p class="text-xs text-slate-500 mt-1">Thiết lập thời hạn đăng ký Giảng viên, Sinh viên, Hạn GVPB và Ngày bảo vệ hội đồng.</p>
                </div>
            </div>

            <div class="space-y-4">
                <div th:each="p : ${periods}" class="p-5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-1 rounded text-xs font-bold bg-blue-100 text-blue-800 uppercase" th:text="${p.typeLabel}">KLTN</span>
                            <h3 class="text-base font-bold text-slate-800" th:text="${p.name}">Khóa luận tốt nghiệp HK1</h3>
                        </div>
                        <span class="text-xs text-slate-400 font-mono" th:text="'Mã đợt: #' + ${p.id}">#1</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs pt-2 border-t border-slate-200/60">
                        <div class="p-2.5 bg-white rounded-lg border border-slate-200">
                            <span class="text-slate-400 block mb-0.5">Thời hạn GV đăng ký:</span>
                            <div class="font-medium text-slate-700" th:text="${#temporals.format(p.lecturerStartAt, 'dd/MM/yy')} + ' - ' + ${#temporals.format(p.lecturerEndAt, 'dd/MM/yy')}">--</div>
                        </div>

                        <div class="p-2.5 bg-white rounded-lg border border-slate-200">
                            <span class="text-slate-400 block mb-0.5">Thời hạn SV đăng ký:</span>
                            <div class="font-medium text-slate-700" th:text="${#temporals.format(p.studentStartAt, 'dd/MM/yy')} + ' - ' + ${#temporals.format(p.studentEndAt, 'dd/MM/yy')}">--</div>
                        </div>

                        <div class="p-2.5 bg-white rounded-lg border border-slate-200" th:if="${p.reviewDeadline != null}">
                            <span class="text-amber-600 font-semibold block mb-0.5">Hạn GV Phản biện:</span>
                            <div class="font-mono text-slate-800" th:text="${#temporals.format(p.reviewDeadline, 'dd/MM/yyyy HH:mm')}">--</div>
                        </div>

                        <div class="p-2.5 bg-white rounded-lg border border-slate-200" th:if="${p.defenseDate != null}">
                            <span class="text-indigo-600 font-semibold block mb-0.5">Ngày bảo vệ Hội đồng:</span>
                            <div class="font-mono text-slate-800 font-bold" th:text="${#temporals.format(p.defenseDate, 'dd/MM/yyyy')}">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
