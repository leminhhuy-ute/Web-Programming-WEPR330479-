<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Người dùng')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: layout(~{::mainContent}, 'admin-users')}"></aside>

    <main class="md:col-span-3 space-y-6" th:fragment="mainContent">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">Quản lý Tài khoản & Phân quyền</h1>
                    <p class="text-xs text-slate-500 mt-1">Quản lý tài khoản Trưởng khoa, Trưởng bộ môn, Giảng viên và Sinh viên.</p>
                </div>
                <button onclick="document.getElementById('modal-create-user').classList.remove('hidden')"
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm flex items-center space-x-2 transition-colors">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Thêm tài khoản</span>
                </button>
            </div>

            <!-- Table List -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase border-y border-slate-200">
                        <tr>
                            <th class="px-4 py-3">Mã / MSSV</th>
                            <th class="px-4 py-3">Họ và Tên</th>
                            <th class="px-4 py-3">Tài khoản & Email</th>
                            <th class="px-4 py-3">Vai trò</th>
                            <th class="px-4 py-3">Bộ môn</th>
                            <th class="px-4 py-3">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="u : ${users}" class="hover:bg-slate-50/80 transition-colors">
                            <td class="px-4 py-3 font-mono text-xs font-semibold text-blue-700" th:text="${u.userCode}">24110019</td>
                            <td class="px-4 py-3 font-medium text-slate-800" th:text="${u.fullName}">Họ và Tên</td>
                            <td class="px-4 py-3 text-xs text-slate-500">
                                <div class="font-mono text-slate-700" th:text="${u.username}">username</div>
                                <div th:text="${u.email}">email@hcmute.edu.vn</div>
                            </td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase"
                                      th:classappend="${u.role == 'DEAN'} ? 'bg-purple-100 text-purple-800' : (${u.role == 'HEAD_OF_DEPT' || u.role == 'LECTURER'} ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800')"
                                      th:text="${u.role}">ROLE</span>
                            </td>
                            <td class="px-4 py-3 text-xs text-slate-600" th:text="${u.departmentName != null ? u.departmentName : 'Ban Chủ nhiệm Khoa'}">Bộ môn</td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold uppercase"
                                      th:classappend="${u.status == 'ACTIVE'} ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'"
                                      th:text="${u.status}">ACTIVE</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Simple Modal Create User -->
        <div id="modal-create-user" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800">Thêm tài khoản người dùng mới</h3>
                    <button onclick="document.getElementById('modal-create-user').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form id="form-user" onsubmit="handleCreateUser(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Mã người dùng (MSSV / Mã GV)</label>
                        <input id="u-code" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="VD: 24110099 hoặc GV009">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Tên đăng nhập</label>
                        <input id="u-username" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="VD: 24110099">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Mật khẩu ban đầu</label>
                        <input id="u-password" type="password" required class="w-full p-2 border border-slate-300 rounded-lg" value="Password@123">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Họ và Tên</label>
                        <input id="u-fullname" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="Họ và tên đầy đủ">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Email</label>
                        <input id="u-email" type="email" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="user@student.hcmute.edu.vn">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Vai trò</label>
                            <select id="u-role" class="w-full p-2 border border-slate-300 rounded-lg">
                                <option value="STUDENT">STUDENT (Sinh viên)</option>
                                <option value="LECTURER">LECTURER (Giảng viên)</option>
                                <option value="HEAD_OF_DEPT">HEAD_OF_DEPT (Trưởng bộ môn)</option>
                                <option value="DEAN">DEAN (Trưởng khoa)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Bộ môn</label>
                            <select id="u-dept" class="w-full p-2 border border-slate-300 rounded-lg">
                                <option value="">-- Không trực thuộc --</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">Bộ môn</option>
                            </select>
                        </div>
                    </div>
                    <div class="pt-3 flex justify-end space-x-2">
                        <button type="button" onclick="document.getElementById('modal-create-user').classList.add('hidden')" class="px-4 py-2 border rounded-lg hover:bg-slate-50">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow">Lưu tài khoản</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            async function handleCreateUser(e) {
                e.preventDefault();
                const payload = {
                    userCode: document.getElementById('u-code').value,
                    username: document.getElementById('u-username').value,
                    password: document.getElementById('u-password').value,
                    fullName: document.getElementById('u-fullname').value,
                    email: document.getElementById('u-email').value,
                    role: document.getElementById('u-role').value,
                    departmentId: document.getElementById('u-dept').value ? Number(document.getElementById('u-dept').value) : null,
                    status: 'ACTIVE'
                };
                try {
                    await apiFetch('/api/admin/users', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    showToast('Đã thêm tài khoản thành công!');
                    setTimeout(() => window.location.reload(), 800);
                } catch (err) {}
            }
        </script>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
