<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phân công đề tài</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('assignments')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Phân công đề tài')}"></header><div class="content"><div th:replace="~{fragments :: alerts}"></div><div class="page-actions"><p>Gán hội đồng và giảng viên phản biện cho từng đề tài.</p></div><div class="alert info"><span class="mi">info</span> Hệ thống tự động chặn GVHD phản biện hoặc chấm đề tài do mình hướng dẫn.</div><section class="assignment-list"><article class="card assignment" th:each="t : ${topics}"><div class="topic-info"><div class="title-row"><span class="code" th:text="${t.code}"></span><span class="status" th:classappend="${t.status.name().toLowerCase()}" th:text="${t.status.label}"></span></div><h3 th:text="${t.title}"></h3><p><span class="mi">group</span> <span th:text="${t.studentGroup}"></span> &nbsp; <span class="mi">school</span> GVHD: <strong th:text="${t.advisor.fullName}"></strong></p><p th:if="${t.council != null}">Hiện tại: <strong th:text="${t.council.code}"></strong> • GVPB: <strong th:text="${t.reviewer.fullName}"></strong></p></div><form class="assign-form" th:action="@{/assignments/{id}(id=${t.id})}" method="post"><label>Hội đồng<select name="councilId" required><option value="">Chọn hội đồng sẵn sàng</option><option th:each="c : ${councils}" th:value="${c.id}" th:text="${c.code + ' • ' + c.room}"></option></select></label><label>Giảng viên phản biện<select name="reviewerId" required><option value="">Chọn GVPB trong hội đồng</option><option th:each="l : ${lecturers}" th:value="${l.id}" th:disabled="${l.id == t.advisor.id}" th:text="${l.fullName + (l.id == t.advisor.id ? ' (GVHD – không thể chọn)' : '')}"></option></select></label><button class="btn primary" type="submit"><span class="mi">assignment_ind</span> Phân công</button></form></article></section></div></main></div></body></html>
