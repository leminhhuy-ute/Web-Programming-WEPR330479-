<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chấm điểm Bảo vệ')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: layout(~{::mainContent}, 'council-grading')}"></aside>

    <main class="md:col-span-3 space-y-6" th:fragment="mainContent">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Chấm điểm Đề tài & Báo cáo Hội đồng</h1>
                <p class="text-xs text-slate-500 mt-1">Dành cho Giảng viên phản biện và Thành viên Hội đồng chấm điểm theo thang điểm 10.</p>
            </div>

            <!-- List Topics for Grading -->
            <div class="space-y-4">
                <div th:each="t : ${approvedTopics}" class="p-5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-0.5 rounded bg-blue-100 text-blue-800 font-mono text-xs font-bold" th:text="${t.topicCode}">KLTN26-001</span>
                            <h3 class="font-bold text-slate-800 text-sm" th:text="${t.title}">Tên đề tài</h3>
                        </div>
                        <span class="px-2.5 py-0.5 rounded text-[11px] font-semibold bg-purple-100 text-purple-800 uppercase" th:text="${t.topicType}">KLTN</span>
                    </div>

                    <div class="text-xs text-slate-500 flex flex-wrap gap-4 pt-2 border-t border-slate-200/60">
                        <span><strong>Bộ môn:</strong> <span th:text="${t.department != null ? t.department.name : '--'}">CNPM</span></span>
                        <span><strong>GVHD chính:</strong> <span th:text="${t.advisor1 != null ? t.advisor1.fullName : '--'}">Thầy A</span></span>
                    </div>

                    <!-- Grading actions -->
                    <div class="pt-2 flex justify-end space-x-2">
                        <button class="btn-grade-topic px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1"
                                th:data-topic-id="${t.id}"
                                th:data-topic-title="${t.title}">
                            <i class="fa-solid fa-star mr-1"></i>
                            <span>Nhập điểm đánh giá</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Grading -->
        <div id="modal-grading" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800">Chấm điểm đánh giá Đề tài</h3>
                    <button onclick="document.getElementById('modal-grading').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form onsubmit="handleGradeSubmit(event)" class="space-y-3 text-xs">
                    <input type="hidden" id="grade-topic-id">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Đề tài đang chấm</label>
                        <div id="grade-topic-name" class="p-2 bg-slate-50 rounded-lg text-slate-700 font-medium">--</div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Loại đánh giá</label>
                        <select id="grade-type" class="w-full p-2 border border-slate-300 rounded-lg">
                            <option value="REVIEWER">Giảng viên Phản biện (REVIEWER)</option>
                            <option value="COUNCIL">Hội đồng Bảo vệ (COUNCIL)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Hội đồng bảo vệ</label>
                        <select id="grade-council-id" class="w-full p-2 border border-slate-300 rounded-lg">
                            <option th:each="c : ${councils}" th:value="${c.id}" th:text="${c.name}">Hội đồng 01</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Điểm đánh giá (0.0 - 10.0)</label>
                        <input id="grade-score" type="number" step="0.1" min="0" max="10" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="VD: 9.0">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Nhận xét & Đánh giá chi tiết</label>
                        <textarea id="grade-feedback" rows="3" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="Nhận xét chất lượng sản phẩm, báo cáo..."></textarea>
                    </div>
                    <div class="pt-3 flex justify-end space-x-2">
                        <button type="button" onclick="document.getElementById('modal-grading').classList.add('hidden')" class="px-4 py-2 border rounded-lg hover:bg-slate-50">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow">Lưu điểm số</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.btn-grade-topic').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.getAttribute('data-topic-id');
                        const title = btn.getAttribute('data-topic-title');
                        document.getElementById('grade-topic-id').value = id;
                        document.getElementById('grade-topic-name').innerText = title;
                        document.getElementById('modal-grading').classList.remove('hidden');
                    });
                });
            });

            async function handleGradeSubmit(e) {
                e.preventDefault();
                const payload = {
                    topicId: Number(document.getElementById('grade-topic-id').value),
                    councilId: Number(document.getElementById('grade-council-id').value),
                    score: Number(document.getElementById('grade-score').value),
                    evaluationType: document.getElementById('grade-type').value,
                    feedback: document.getElementById('grade-feedback').value
                };

                try {
                    await apiFetch('/api/grading/evaluate', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    showToast('Đã lưu điểm và nhận xét thành công!');
                    document.getElementById('modal-grading').classList.add('hidden');
                    setTimeout(() => window.location.reload(), 800);
                } catch (err) {}
            }
        </script>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
