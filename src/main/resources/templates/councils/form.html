<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo hội đồng</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('councils')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Tạo Hội đồng mới')}"></header><div class="content narrow"><a class="back-link" th:href="@{/councils}"><span class="mi">arrow_back</span> Danh sách hội đồng</a><form class="card form-card" th:action="@{/councils/save}" th:object="${council}" method="post"><div class="card-head"><div><h3>Thông tin chung</h3><p>Sau khi tạo, bạn có thể bổ sung 3–5 thành viên.</p></div></div><div class="form-grid"><label>Mã hội đồng *<input th:field="*{code}" placeholder="VD: HD-KLTN-01"><small class="field-error" th:errors="*{code}"></small></label><label>Tên hội đồng *<input th:field="*{name}" placeholder="Hội đồng bảo vệ KLTN 01"><small class="field-error" th:errors="*{name}"></small></label><label>Thời gian bảo vệ *<input type="datetime-local" th:field="*{defenseDate}"><small class="field-error" th:errors="*{defenseDate}"></small></label><label>Phòng *<input th:field="*{room}" placeholder="VD: A4-401"><small class="field-error" th:errors="*{room}"></small></label></div><div class="form-actions"><a class="btn ghost" th:href="@{/councils}">Hủy</a><button class="btn primary" type="submit"><span class="mi">arrow_forward</span> Tạo và thêm thành viên</button></div></form></div></main></div></body></html>
