<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý hội đồng</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('councils')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Quản lý Hội đồng')}"></header><div class="content"><div th:replace="~{fragments :: alerts}"></div><div class="page-actions"><p>Tạo hội đồng, phân vai trò và kiểm soát đủ 3–5 thành viên.</p><a class="btn primary" th:href="@{/councils/new}"><span class="mi">add</span> Tạo hội đồng</a></div><section class="council-grid"><a class="council-card" th:each="item : ${councils}" th:href="@{/councils/{id}(id=${item.id})}"><div class="card-top"><span class="code" th:text="${item.code}"></span><span class="status" th:classappend="${item.status.name().toLowerCase()}" th:text="${item.status.label}"></span></div><h3 th:text="${item.name}"></h3><div class="meta"><span><i class="mi">calendar_month</i><span th:text="${#temporals.format(item.defenseDate,'dd/MM/yyyy • HH:mm')}"></span></span><span><i class="mi">meeting_room</i><span th:text="${item.room}"></span></span><span><i class="mi">groups</i><span th:text="${item.members.size() + '/5 thành viên'}"></span></span></div><div class="members-preview"><span class="avatar" th:each="m : ${item.members}" th:text="${m.lecturer.fullName.substring(0,1)}"></span><span class="view">Xem chi tiết <i class="mi">arrow_forward</i></span></div></a></section><div class="empty" th:if="${#lists.isEmpty(councils)}"><span class="mi">groups</span><h3>Chưa có hội đồng</h3><p>Hãy tạo hội đồng đầu tiên cho đợt bảo vệ.</p></div></div></main></div></body></html>
