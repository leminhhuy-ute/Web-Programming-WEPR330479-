<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu chấm điểm</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('grading')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Phiếu chấm điểm')}"></header><div class="content"><div th:replace="~{fragments :: alerts}"></div><a class="back-link" th:href="@{/grading}"><span class="mi">arrow_back</span> Danh sách chấm điểm</a><section class="detail-banner grade-banner"><div><div class="title-row"><span class="code" th:text="${topic.code}"></span><span class="status" th:classappend="${topic.status.name().toLowerCase()}" th:text="${topic.status.label}"></span></div><h2 th:text="${topic.title}"></h2><p><span class="mi">group</span> <span th:text="${topic.studentGroup}"></span> • GVHD: <strong th:text="${topic.advisor.fullName}"></strong> • Hội đồng: <strong th:text="${topic.council.code}"></strong></p></div><div class="final-score"><small>ĐIỂM TRUNG BÌNH</small><strong th:text="${topic.finalScore != null ? topic.finalScore : '—'}"></strong><span>/ 10</span></div></section><div class="two-columns grading-cols"><section class="card"><div class="card-head"><div><h3>Nhập điểm & nhận xét</h3><p>GVHD được hiển thị nhưng không thể chọn.</p></div></div><form class="grading-form" th:action="@{/grading/{id}(id=${topic.id})}" method="post"><label>Giảng viên chấm<select name="evaluatorId" required><option value="">Chọn thành viên</option><option th:each="m : ${members}" th:value="${m.lecturer.id}" th:disabled="${m.lecturer.id == topic.advisor.id}" th:text="${m.lecturer.fullName + ' • ' + m.role.label + (m.lecturer.id == topic.advisor.id ? ' (GVHD)' : '')}"></option></select></label><label>Điểm (0–10)<input name="score" type="number" min="0" max="10" step="0.01" placeholder="VD: 8.50" required></label><label>Nhận xét<textarea name="comment" rows="6" maxlength="2000" placeholder="Nhận xét về nội dung, kết quả và hướng cải thiện..." required></textarea></label><button class="btn primary" type="submit"><span class="mi">save</span> Lưu phiếu chấm</button></form></section><section class="card"><div class="card-head"><div><h3>Kết quả thành viên</h3><p th:text="${evaluations.size() + ' phiếu đã nhập'}"></p></div></div><div class="evaluation-list"><article th:each="e : ${evaluations}"><div class="evaluation-head"><div><span class="avatar" th:text="${e.evaluator.fullName.substring(0,1)}"></span><strong th:text="${e.evaluator.fullName}"></strong></div><span class="individual-score" th:text="${e.score}"></span></div><p th:text="${e.comment}"></p><small th:text="${'Cập nhật ' + #temporals.format(e.updatedAt,'dd/MM/yyyy HH:mm')}"></small></article><div class="empty compact" th:if="${#lists.isEmpty(evaluations)}"><span class="mi">rate_review</span><p>Chưa có phiếu chấm nào.</p></div></div></section></div></div></main></div></body></html>
