<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chấm điểm</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('grading')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Chấm điểm & Nhận xét')}"></header><div class="content"><div th:replace="~{fragments :: alerts}"></div><div class="page-actions"><p>Nhập điểm thang 10, nhận xét và theo dõi điểm trung bình hội đồng.</p></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Đề tài / Nhóm</th><th>Hội đồng</th><th>GVPB</th><th>Trạng thái</th><th>Điểm TB</th><th></th></tr></thead><tbody><tr th:each="t : ${topics}"><td><strong th:text="${t.code}"></strong></td><td><strong th:text="${t.title}"></strong><small th:text="${t.studentGroup}"></small></td><td th:text="${t.council.code}"></td><td th:text="${t.reviewer.fullName}"></td><td><span class="status" th:classappend="${t.status.name().toLowerCase()}" th:text="${t.status.label}"></span></td><td><strong class="score" th:text="${t.finalScore != null ? t.finalScore : '—'}"></strong></td><td><a class="btn small secondary" th:href="@{/grading/{id}(id=${t.id})}">Chấm điểm</a></td></tr></tbody></table></div></section></div></main></div></body></html>
