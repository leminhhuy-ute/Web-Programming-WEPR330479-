<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Duyệt Đề tài Bộ môn')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: sidebar('lecturer-approval')}"></aside>
    <main class="md:col-span-3 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Thẩm định & Phê duyệt Đề tài Cấp Bộ môn</h1>
                <p class="text-xs text-slate-500 mt-1">Dành cho Trưởng Bộ môn (HEAD_OF_DEPT): Đánh giá tính khả thi, duyệt đề tài và phân công GVHD 2.</p>
            </div>

            <div class="space-y-4">
                <div th:each="t : ${departmentTopics}" class="p-5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-mono text-xs font-bold" th:text="${t.topicCode}">DT01</span>
                            <h3 class="font-bold text-slate-800 text-sm" th:text="${t.title}">Tên đề tài</h3>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase"
                              th:classappend="${t.status == 'APPROVED'} ? 'bg-emerald-100 text-emerald-800' : (${t.status == 'PENDING'} ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')"
                              th:text="${t.status}">PENDING</span>
                    </div>

                    <p class="text-xs text-slate-600 leading-relaxed" th:text="${t.description}">Mô tả</p>

                    <div class="text-xs text-slate-500 flex flex-wrap gap-4 pt-2 border-t border-slate-200/60">
                        <span><strong>Người đề xuất:</strong> <span th:text="${t.createdByName}">Thầy A</span></span>
                        <span><strong>GVHD 1:</strong> <span th:text="${t.advisor1Name != null ? t.advisor1Name : 'Chưa phân công'}">GVHD1</span></span>
                        <span><strong>GVHD 2:</strong> <span th:text="${t.advisor2Name != null ? t.advisor2Name : 'Chưa có'}">GVHD2</span></span>
                    </div>

                    <!-- Approval Buttons -->
                    <div class="pt-2 flex justify-end space-x-2" th:if="${t.status == 'PENDING'}">
                        <button th:onclick="'reviewTopic(' + ${t.id} + ', false)'" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-lg border border-rose-200 transition-colors">
                            <i class="fa-solid fa-xmark mr-1"></i> Từ chối
                        </button>
                        <button th:onclick="'reviewTopic(' + ${t.id} + ', true)'" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                            <i class="fa-solid fa-check mr-1"></i> Duyệt đề tài
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            async function reviewTopic(topicId, isApproved) {
                const status = isApproved ? 'APPROVED' : 'REJECTED';
                let reason = '';
                if (!isApproved) {
                    reason = prompt('Nhập lý do từ chối đề tài:') || 'Chưa đạt yêu cầu chuyên môn';
                }
                try {
                    await apiFetch(`/api/lecturer/department-topics/${topicId}/approval`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: status, rejectionReason: reason })
                    });
                    showToast(isApproved ? 'Đã duyệt đề tài thành công!' : 'Đã từ chối đề tài.');
                    setTimeout(() => window.location.reload(), 800);
                } catch (err) {}
            }
        </script>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
