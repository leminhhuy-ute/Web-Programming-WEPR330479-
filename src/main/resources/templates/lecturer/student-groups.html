<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Duyệt Nhóm Sinh viên')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: sidebar('lecturer-groups')}"></aside>
    <main class="md:col-span-3 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Xét duyệt Nhóm Sinh viên Đăng ký Đề tài</h1>
                <p class="text-xs text-slate-500 mt-1">Giảng viên hướng dẫn xem xét năng lực nhóm sinh viên và đồng ý/từ chối hướng dẫn.</p>
            </div>

            <div class="space-y-4">
                <div th:if="${#lists.isEmpty(registrations)}" class="p-8 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                    <i class="fa-solid fa-inbox text-3xl mb-2 text-slate-300"></i>
                    <p class="text-xs">Hiện không có đơn đăng ký đề tài nào đang chờ xử lý.</p>
                </div>

                <div th:each="r : ${registrations}" class="p-5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-mono text-xs font-bold" th:text="${r.groupCode}">GRP-01</span>
                                <h3 class="font-bold text-slate-800 text-sm" th:text="${r.groupName}">Tên Nhóm</h3>
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">Nhóm trưởng: <strong class="text-slate-700" th:text="${r.leaderName}">SV</strong> | Thành viên: <span th:text="${r.memberCount}">3</span> bạn</p>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[11px] font-semibold uppercase"
                              th:classappend="${r.status == 'APPROVED'} ? 'bg-emerald-100 text-emerald-800' : (${r.status == 'PENDING'} ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800')"
                              th:text="${r.status}">STATUS</span>
                    </div>

                    <div class="p-3 bg-white rounded-lg border border-slate-200 text-xs space-y-1">
                        <div><strong class="text-slate-700">Đề tài đăng ký:</strong> <span class="font-medium text-blue-800" th:text="${r.topicTitle}">Tên đề tài</span></div>
                        <div th:if="${r.proposalNote != null}"><strong class="text-slate-700">Lời nhắn từ nhóm:</strong> <span class="text-slate-600 italic" th:text="${r.proposalNote}">Lời nhắn</span></div>
                    </div>

                    <div class="pt-2 flex justify-end space-x-2" th:if="${r.status == 'PENDING'}">
                        <button th:onclick="'reviewRegistration(' + ${r.id} + ', false)'" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-lg border border-rose-200 transition-colors">
                            <i class="fa-solid fa-xmark mr-1"></i> Từ chối
                        </button>
                        <button th:onclick="'reviewRegistration(' + ${r.id} + ', true)'" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                            <i class="fa-solid fa-check mr-1"></i> Đồng ý hướng dẫn
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            async function reviewRegistration(regId, isApproved) {
                const status = isApproved ? 'APPROVED' : 'REJECTED';
                const feedback = prompt(isApproved ? 'Nhập phản hồi cho nhóm:' : 'Nhập lý do từ chối:') || '';
                try {
                    await apiFetch(`/api/lecturer/department-topics/group-registrations/${regId}/approval`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: status, supervisorFeedback: feedback })
                    });
                    showToast(isApproved ? 'Đã duyệt nhóm sinh viên!' : 'Đã từ chối đơn đăng ký.');
                    setTimeout(() => window.location.reload(), 800);
                } catch (err) {}
            }
        </script>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
