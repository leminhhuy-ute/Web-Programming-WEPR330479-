<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin giảng viên</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('lecturers')}"></aside><main class="main"><header th:replace="~{fragments :: topbar(${lecturer.id == null ? 'Thêm giảng viên' : 'Cập nhật giảng viên'})}"></header><div class="content narrow"><a class="back-link" th:href="@{/lecturers}"><span class="mi">arrow_back</span> Danh sách giảng viên</a><form class="card form-card" th:action="@{/lecturers/save}" th:object="${lecturer}" method="post"><input type="hidden" th:field="*{id}"><div class="card-head"><div><h3>Thông tin giảng viên</h3><p>Các trường có dấu * là bắt buộc.</p></div></div><div class="form-grid"><label>Mã giảng viên *<input th:field="*{code}" placeholder="VD: GV001"><small class="field-error" th:errors="*{code}"></small></label><label>Họ và tên *<input th:field="*{fullName}" placeholder="VD: TS. Nguyễn Văn A"><small class="field-error" th:errors="*{fullName}"></small></label><label>Email *<input type="email" th:field="*{email}" placeholder="name@hcmute.edu.vn"><small class="field-error" th:errors="*{email}"></small></label><label>Bộ môn *<select th:field="*{department}"><option value="">Chọn bộ môn</option><option th:each="d : ${departments}" th:value="${d}" th:text="${d.label}"></option></select><small class="field-error" th:errors="*{department}"></small></label><label class="check-label"><input type="checkbox" th:field="*{active}"> Đang hoạt động</label></div><div class="form-actions"><a class="btn ghost" th:href="@{/lecturers}">Hủy</a><button class="btn primary" type="submit"><span class="mi">save</span> Lưu thông tin</button></div></form></div></main></div></body></html>
