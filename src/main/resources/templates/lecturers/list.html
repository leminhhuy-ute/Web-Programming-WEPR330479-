<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giảng viên phản biện</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar('lecturers')}"></aside><main class="main"><header th:replace="~{fragments :: topbar('Giảng viên phản biện')}"></header><div class="content"><div th:replace="~{fragments :: alerts}"></div><div class="page-actions"><div><p>Quản lý danh sách giảng viên có thể tham gia phản biện và hội đồng.</p></div><a class="btn primary" th:href="@{/lecturers/new}"><span class="mi">person_add</span> Thêm giảng viên</a></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Mã GV</th><th>Họ và tên</th><th>Bộ môn</th><th>Email</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="item : ${lecturers}"><td><strong th:text="${item.code}"></strong></td><td th:text="${item.fullName}"></td><td th:text="${item.department.label}"></td><td th:text="${item.email}"></td><td><span class="status" th:classappend="${item.active ? 'ready' : 'draft'}" th:text="${item.active ? 'Đang hoạt động' : 'Đã tạm ngưng'}"></span></td><td class="row-actions"><a class="icon-btn" th:href="@{/lecturers/{id}/edit(id=${item.id})}" title="Sửa"><span class="mi">edit</span></a><form th:action="@{/lecturers/{id}/toggle(id=${item.id})}" method="post"><button class="icon-btn" type="submit" th:title="${item.active ? 'Tạm ngưng' : 'Kích hoạt'}"><span class="mi" th:text="${item.active ? 'block' : 'check_circle'}"></span></button></form></td></tr></tbody></table></div></section></div></main></div></body></html>
