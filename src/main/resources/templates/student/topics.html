<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục Đề tài')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
    <aside class="md:col-span-1" th:replace="~{fragments/layout :: sidebar('student-topics')}"></aside>
    <main class="md:col-span-3 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Danh mục Đề tài Đã Phê Duyệt</h1>
                <p class="text-xs text-slate-500 mt-1">Tra cứu danh sách đề tài KLTN, TLCN và đăng ký cho nhóm sinh viên.</p>
            </div>

            <div class="space-y-4">
                <div th:each="t : ${availableTopics}" class="p-5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-0.5 rounded bg-blue-100 text-blue-800 font-mono text-xs font-bold" th:text="${t.topicCode}">KLTN26-001</span>
                            <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-100 text-purple-800" th:text="${t.topicTypeLabel}">KLTN</span>
                            <h3 class="font-bold text-slate-800 text-base" th:text="${t.title}">Tên đề tài</h3>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-100 text-emerald-800 uppercase">ĐÃ DUYỆT</span>
                    </div>

                    <p class="text-xs text-slate-600 leading-relaxed" th:text="${t.description}">Mô tả chi tiết</p>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs text-slate-500 pt-2 border-t border-slate-200/60">
                        <div><strong>Bộ môn:</strong> <span class="text-slate-700" th:text="${t.departmentName}">CNPM</span></div>
                        <div><strong>GVHD chính:</strong> <span class="text-slate-700 font-medium" th:text="${t.advisor1Name != null ? t.advisor1Name : t.createdByName}">Thầy A</span></div>
                        <div><strong>Yêu cầu:</strong> <span class="text-slate-700" th:text="${t.requirements}">Java, Spring Boot</span></div>
                    </div>

                    <div class="pt-2 flex justify-end">
                        <button class="btn-register-topic px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1"
                                th:data-topic-id="${t.id}"
                                th:data-topic-title="${t.title}">
                            <i class="fa-solid fa-file-pen mr-1"></i>
                            <span>Đăng ký đề tài này</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.btn-register-topic').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const topicId = btn.getAttribute('data-topic-id');
                        const title = btn.getAttribute('data-topic-title');
                        const note = prompt(`Đăng ký đề tài: "${title}"\nNhập lời nhắn / lý do lựa chọn của nhóm gửi GVHD:`) || '';

                        try {
                            await apiFetch('/api/student/topics/register', {
                                method: 'POST',
                                body: JSON.stringify({
                                    topicId: Number(topicId),
                                    proposalNote: note
                                })
                            });
                            showToast('Đã gửi đơn đăng ký đề tài thành công!');
                            setTimeout(() => window.location.href = '/student/dashboard', 800);
                        } catch (err) {}
                    });
                });
            });
        </script>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
