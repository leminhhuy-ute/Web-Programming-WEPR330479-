<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bộ môn - Quản lý đề tài</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body data-admin data-module="departments" data-view="list">
    <main class="main-content">
        <div id="nav"></div>
        <div class="page-header">
            <div>
                <h1>Bộ môn</h1>
                <p class="page-subtitle">Thiết lập các bộ môn trực thuộc Khoa Công nghệ Thông tin.</p>
            </div>
            <a class="button primary" href="form.html">+ Thêm bộ môn</a>
        </div>
        <form id="search" class="toolbar">
            <input id="keyword" name="keyword" placeholder="Tìm kiếm bộ môn..." autocomplete="off">
            <button class="button secondary" type="submit">Tìm</button>
        </form>
        <p id="message" class="alert error" hidden role="alert"></p>
        <div class="card table-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="width: 140px;">Mã bộ môn</th>
                        <th style="width: 280px;">Tên bộ môn</th>
                        <th>Mô tả chức năng & nhiệm vụ</th>
                        <th style="width: 180px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin-shell.js"></script>
    <script src="../../assets/js/admin-crud.js"></script>
</body>

</html>
